site_name: SoberMeng 的知识库
site_description: 网络、Linux、云计算与自动化运维笔记
site_author: SoberMeng
site_url: !ENV [SITE_URL, "http://10.24.32.143:28080/"]

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  custom_dir: overrides

  palette:
    - scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sobermeng166
      name: GitHub
  generator: false

copyright: Copyright &copy; 2026 SoberMeng

